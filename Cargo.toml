[package]
name = "thumbvol"
version = "0.1.0"
edition = "2024"
description = "Lightweight thumb-wheel-to-volume daemon for Logitech MX Master mice (Windows/Linux)"
license = "MIT"
repository = "https://github.com/user137/thumbvol"
readme = "README.md"

[lib]
name = "thumbvol"
path = "src/lib.rs"

[[bin]]
name = "thumbvol"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }
winreg = "0.52"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2"

[dev-dependencies]
tempfile = "3"
proptest = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
