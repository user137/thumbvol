# Скопіювати в:
#   Windows: %APPDATA%\thumbvol\config.toml
#   Linux:   $XDG_CONFIG_HOME/thumbvol/config.toml  (типово ~/.config/thumbvol/config.toml)
#
# Файл необов'язковий — за відсутності використовуються дефолти нижче.
#
# Увага: зміна Invert чи Sensitivity з трей-меню (Windows) перезаписує весь
# файл без коментарів — лишаються тільки значення. Тримайте цей файл окремо
# як довідник, якщо коментарі важливі.

[wheel]
# Скільки фізичних кліків бічного колеса на одну зміну гучності.
# Менше = чутливіше. 1 — максимальна чутливість.
notches_per_step = 1

# Реверс напрямку: вперед/назад міняються місцями.
invert = false

# Скільки натискань клавіші гучності (~2% кожне, залежить від ОС) на один
# спрацьований крок. Підняти, якщо один крок гучності на клік відчувається
# занадто повільно. Перевірено на реальному MX Master: 2 — комфортне значення.
sensitivity = 2

[general]
# Реєструвати автозапуск з ОС (Windows: HKCU...\Run; Linux: XDG autostart).
autostart = true

[linux]
# Явний шлях до /dev/input/eventN, якщо автовизначення (перший пристрій з
# REL_HWHEEL) знаходить не ту мишу. За замовчуванням не задано.
# device_path = "/dev/input/event7"
